<style>
/* Layout: settings panel on the left, results on the right; one column on phones. One deliberate look: black with red. */
:root {
  --bg: #08080a; --panel: #121215; --sunk: #0c0c0e; --ink: #eeeaea; --muted: #9b9497; --line: #2a2629;
  --accent: #e2333f; --accent-soft: #2c0f13; --accent-ink: #ffffff;
  --teal: #ff5a63; --teal-soft: #2a1013; --warn: #ff8a8f; --warn-soft: #34131a; --bad: #ff6b72;
  --bar: #2f2a2d;
  --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 4px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { font: 600 26px/1.1 var(--f-display); letter-spacing: .02em; margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 62ch; }
h2 { font: 600 13px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 10px; }
.grid { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.stack { display: grid; gap: 18px; min-width: 0; }
.field { display: grid; gap: 8px; }
.field + .field { margin-top: 18px; }
label.lbl, .lbl { font-weight: 600; font-size: 13px; }
.hint { color: var(--muted); font-size: 12.5px; }
textarea { width: 100%; min-height: 220px; resize: vertical; background: var(--sunk); color: var(--ink); border: 1px solid var(--line);
  border-radius: var(--r); padding: 10px; font: 12.5px/1.45 var(--f-mono); }
textarea#trained { min-height: 110px; }
textarea:focus, input:focus, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--sunk); color: var(--ink); padding: 8px 6px; font: 500 13px var(--f-body); cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.attrs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.attrs label { display: grid; gap: 3px; font-size: 11px; color: var(--muted); text-align: center; }
.attrs input { width: 100%; text-align: center; padding: 7px 2px; border: 1px solid var(--line); border-radius: var(--r); background: var(--sunk); color: var(--ink); font: 500 14px var(--f-mono); }
.sum { font-size: 12px; color: var(--muted); }
.sum.bad { color: var(--bad); }
details summary { cursor: pointer; font-weight: 600; font-size: 13px; }
details[open] summary { margin-bottom: 8px; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--sunk); color: var(--ink);
  border-radius: var(--r); padding: 7px 12px; font: 500 13px var(--f-body); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 4px 9px; font-size: 12px; }

/* Summary */
.summary { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.summary > div { background: var(--panel); padding: 14px 16px; min-width: 0; }
.summary .k { font: 600 11px var(--f-display); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.summary .v { font: 600 30px/1.15 var(--f-display); font-variant-numeric: tabular-nums; margin-top: 4px; }
.summary .v.mid { font-size: 22px; }
.summary .gain { color: var(--teal); }
.summary .n { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
@media (max-width: 620px) { .summary { grid-template-columns: 1fr 1fr; } .summary > div:first-child { grid-column: 1 / -1; } }

/* Remap cards */
.remaps { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.remap { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; background: var(--panel); min-width: 0; }
.remap.first { border-color: var(--accent); }
.remap .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.remap .title { font: 600 15px var(--f-display); }
.remap .when { font-size: 12px; color: var(--muted); }
.arow { display: grid; grid-template-columns: 92px minmax(0, 1fr) 28px 34px; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
.arow .track { height: 8px; background: var(--sunk); border: 1px solid var(--line); border-radius: 2px; position: relative; overflow: hidden; }
.arow .fill { position: absolute; inset: 0 auto 0 0; background: var(--bar); }
.arow.up .fill { background: var(--accent); }
.arow .val { font: 600 14px var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.arow .d { font: 12px var(--f-mono); color: var(--muted); }
.arow.up .d { color: var(--accent); }
.remap .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.remap .foot b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; }

/* Suggestions */
.sg { display: grid; gap: 14px; }
.sg-group { border-top: 1px solid var(--line); padding-top: 10px; }
.sg-group:first-child { border-top: 0; padding-top: 0; }
.sg-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.sg-head .t { font-weight: 600; }
.sg-head .w { color: var(--muted); font-size: 12.5px; }
.sg-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 5px 0; }
.sg-row .nm { min-width: 0; }
.sg-row .nm small { display: block; color: var(--muted); font-size: 12px; }
.sg-row .tm { font: 12.5px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.plus { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--teal); background: var(--teal-soft); color: var(--teal); font: 600 17px/1 var(--f-mono); cursor: pointer; display: grid; place-items: center; }
.plus:hover { background: var(--teal); color: var(--panel); }
.chip { display: inline-block; font: 600 10.5px var(--f-body); letter-spacing: .04em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; vertical-align: 1px; }
.chip.must { background: var(--warn-soft); color: var(--warn); }
.chip.check { background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
.note { background: var(--warn-soft); color: var(--warn); border-radius: var(--r); padding: 10px 12px; font-size: 13px; }
.note.info { background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
.empty { color: var(--muted); font-size: 13px; }

/* Queue */
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.qhead h2 { margin: 0; }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font: 600 11px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.num, th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.i { color: var(--muted); font-family: var(--f-mono); width: 36px; }
td .lv { font-family: var(--f-mono); color: var(--accent); margin-left: 4px; }
td .auto { font-size: 11px; color: var(--muted); margin-left: 6px; }
.pair { font: 11.5px var(--f-mono); color: var(--muted); white-space: nowrap; }
tr.divider td { background: var(--accent-soft); color: var(--ink); font-weight: 600; border-bottom: 1px solid var(--accent); }
tr.divider td small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: var(--r); font-size: 13px; }
.lvbar { display: inline-flex; gap: 2px; vertical-align: middle; margin-left: 6px; }
.lvbar i { width: 7px; height: 7px; border: 1px solid var(--muted); display: inline-block; }
.lvbar i.on { background: var(--muted); }
.lvbar i.new { background: var(--accent); border-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
body { background: radial-gradient(1200px 500px at 85% -10%, var(--accent-soft), transparent 60%), var(--bg); background-attachment: fixed; }
header.top { border-bottom: 1px solid var(--line); padding-bottom: 16px; }
h1 { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.panel, .remap, .summary { box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
.remap.first { box-shadow: 0 0 0 1px var(--accent), 0 0 24px -8px var(--accent); }
.seg button[aria-pressed="true"] { box-shadow: inset 0 -2px 0 rgba(0,0,0,.35); }
.summary .v:first-of-type { color: var(--ink); }
.lang { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: var(--r); padding: 6px 10px; font: 600 13px var(--f-display); letter-spacing: .08em; cursor: pointer; }
.lang:hover { border-color: var(--accent); }
[hidden] { display: none !important; }
#inFit { display: grid; gap: 18px; margin-bottom: 18px; }
#inFit .field + .field { margin-top: 0; }
#segRace { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
#segRace button:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
#segRace button:nth-child(3) { border-right: 0; }
.tabs { display: flex; gap: 4px; margin: 0 0 18px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 10px 14px; margin-bottom: -1px;
  font: 600 14px var(--f-display); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--ink); }
textarea#fit { min-height: 300px; }
.fitrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.fitrow:last-child { border-bottom: 0; }
.fitrow .tm { font: 12.5px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fitrow.done { opacity: .55; }
.fitrow small { display: block; color: var(--muted); font-size: 12px; }
.fitgrp + .fitgrp { margin-top: 16px; }
.fitgrp h3 { font: 600 13px var(--f-display); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 4px; color: var(--accent); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.lang svg { width: 24px; height: 15px; display: block; border-radius: 2px; box-shadow: 0 0 0 1px rgba(255,255,255,.15); }
.seg button { min-width: 0; }
@media (max-width: 520px) { #segRace { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); } #segRace button:nth-child(-n+3) { border-bottom: 1px solid var(--line); } #segRace button:nth-child(3) { border-right: 0; } }
</style>

      </section>
    </main>
  </div>
</div>

<script>
// ---- Engine: skill data, plan parsing, remap, ordering. No DOM. ----
const ATTRS = ['P', 'M', 'W', 'I', 'C']; // order of the in-game remap window
const ANAME = { P: 'Perception', M: 'Memory', W: 'Willpower', I: 'Intelligence', C: 'Charisma' };
const LV = [0, 250, 1415, 8000, 45255, 256000];
const ROMAN = { i: 1, ii: 2, iii: 3, iv: 4, v: 5 };

const BY_ID = new Map();
const BY_NAME = new Map();
for (const [id, name, group, rank, p, s, req] of SKILLS) {
  const sk = { id, name, group, rank, p, s, req };
  BY_ID.set(id, sk);
  BY_NAME.set(name.toLowerCase(), sk);
}

function skillByName(n) { return BY_NAME.get(n.trim().toLowerCase().replace(/\s+/g, ' ')); }

// Returns {entries:[{id,lvl}], unknown:[line]}
function parseList(text) {
  const entries = [], unknown = [];
  for (let raw of String(text || '').split(/\r?\n/)) {
    let line = raw.replace(/^[\s\-•*·\d]+[.)]\s+/, '').replace(/\t+/g, ' ').trim();
    if (!line) continue;
    const m = line.match(/^(.+?)\s+(?:level\s+|lvl\s+|poziom\s+)?([1-5]|iv|v|i{1,3})(?=\s|$|[^a-z])/i);
    let sk = null, lvl = 0;
    if (m) { sk = skillByName(m[1]); lvl = /\d/.test(m[2]) ? +m[2] : ROMAN[m[2].toLowerCase()]; }
    if (!sk || !lvl) { unknown.push(raw.trim()); continue; }
    entries.push({ id: sk.id, lvl });
  }
  return { entries, unknown };
}

function spFor(sk, L) { return sk.rank * (LV[L] - LV[L - 1]); }
function rateOf(sk, a, imp) { return (a[sk.p] + imp) + (a[sk.s] + imp) / 2; } // SP/min

// Builds queue entries from the plan. trainedExtra: Map id->level (optional pasted trained skills).
// starter: Map id->level of starting skills; they only count for skills outside the plan.
function buildPlan(entries, trainedExtra, starter) {
  const planned = new Map(); // id -> Set of levels
  for (const e of entries) {
    if (!planned.has(e.id)) planned.set(e.id, new Set());
    planned.get(e.id).add(e.lvl);
  }
  const trained = new Map(trainedExtra || []);
  const items = [], byKey = new Map(), skillRange = new Map();
  for (const [id, set] of planned) {
    const sk = BY_ID.get(id);
    const min = Math.min(...set), max = Math.max(...set);
    // Levels below the first one in the plan are treated as trained.
    const have = Math.max(trained.get(id) || 0, min - 1);
    trained.set(id, have);
    if (have >= max) continue;
    skillRange.set(id, { from: have + 1, to: max });
    for (let L = have + 1; L <= max; L++) {
      const it = { key: id + ':' + L, sk, lvl: L, sp: spFor(sk, L), auto: !set.has(L), deps: [] };
      items.push(it); byKey.set(it.key, it);
    }
  }
  for (const [id, lvl] of starter || []) if (!planned.has(id) && (trained.get(id) || 0) < lvl) trained.set(id, lvl);
  const missing = new Map(); // id -> {sk, lvl, by:Set, inPlan}
  const levelOf = id => skillRange.has(id) ? skillRange.get(id).to : (trained.get(id) || 0);
  for (const it of items) {
    if (it.lvl > 1 && byKey.has(it.sk.id + ':' + (it.lvl - 1))) it.deps.push(byKey.get(it.sk.id + ':' + (it.lvl - 1)));
    if (it.lvl !== skillRange.get(it.sk.id).from) continue;
    for (const [r, rl] of it.sk.req) {
      const rr = skillRange.get(r);
      const dep = byKey.get(r + ':' + rl) || (rr && rl > rr.to ? byKey.get(r + ':' + rr.to) : null);
      if (dep) it.deps.push(dep);
      if (levelOf(r) < rl) {
        const m = missing.get(r) || { sk: BY_ID.get(r), lvl: 0, by: new Set(), inPlan: planned.has(r), have: levelOf(r) };
        m.lvl = Math.max(m.lvl, rl); m.by.add(it.sk.name); missing.set(r, m);
      }
    }
  }
  return { items, missing: [...missing.values()], levelOf, planned };
}

// All remaps: each attribute 17..27, 99 in total.
const REMAPS = [];
(function gen(i, left, cur) {

  for (let x = 0; x <= Math.min(10, left); x++) gen(i + 1, left - x, [...cur, x]);

// Cybernetics: while training level L you have L-1, so implants work up to +(L-1) at most.

  while (bfs()) { for (let i = 0; i < N; i++) it2[i] = head[i]; while (dfs(S, Infinity) > 1e-12); }
  const seen = new Uint8Array(N); const q = [S]; seen[S] = 1;
  for (let h = 0; h < q.length; h++) { const u = q[h]; for (let e = head[u]; e >= 0; e = nxt[e]) if (cap[e] > 1e-9 && !seen[to[e]]) { seen[to[e]] = 1; q.push(to[e]); } }
  return items.map((_, i) => !!seen[i]);
}

function pureRemap(p, s) { const a = { P: 17, M: 17, W: 17, I: 17, C: 17 }; a[p] = 27; if (s !== p) a[s] = 21; else a[p] = 27; return a; }
const sameA = (x, y) => ATTRS.every(k => x[k] === y[k]);

function bestTwo(items, imp) {
  const starts = []; const push = a => { if (!starts.some(b => sameA(a, b))) starts.push(a); };
  push(bestRemap(items, imp).a);
  for (const [p, s] of aggregate(items, imp)) push(pureRemap(p, s));
  let best = null;
  for (const a0 of starts) for (const b0 of starts) {
    if (a0 === b0) continue;
    let rA = a0, rB = b0, total = Infinity, A = null, B = null;
    for (let iter = 0; iter < 12; iter++) {
      const w = items.map(it => it.first ? 1e12 : itT(it, rB, imp) - itT(it, rA, imp));
      const inA = closure(items, w);
      const nA = items.filter((_, i) => inA[i]), nB = items.filter((_, i) => !inA[i]);
      const bA = nA.length ? bestRemap(nA, imp) : { a: rA, t: 0 };
      const bB = nB.length ? bestRemap(nB, imp) : { a: rB, t: 0 };
      const t = bA.t + bB.t;
      if (t >= total - 1e-6) break;
      total = t; A = nA; B = nB; rA = bA.a; rB = bB.a;
    }
    if (A && (!best || total < best.total)) best = { total, blocks: [{ a: rA, items: A }, { a: rB, items: B }] };
  }
  best.blocks = best.blocks.filter(b => b.items.length);
  return best;
}

// Order inside a block: shortest first, but prerequisites always earlier.
function orderBlock(items, a, imp, done) {
  const left = new Set(items), out = [];
  const ready = it => it.deps.every(d => done.has(d));
  while (left.size) {
    let pick = null, pt = Infinity;
    // Cybernetics and its prerequisites always go first, so implants can be plugged in as soon as possible.
    const firstLeft = [...left].some(it => it.first);
    for (const it of left) if (ready(it) && (!firstLeft || it.first)) { const t = itT(it, a, imp); if (t < pt || (t === pt && it.lvl < pick.lvl)) { pt = t; pick = it; } }
    if (!pick) { pick = left.values().next().value; pt = itT(pick, a, imp); } // should not happen
    left.delete(pick); done.add(pick); out.push({ it: pick, t: pt });
  }
  return out;
}

function plan(items, mode, cur, imp) {
  const mark = it => { if (it.first) return; it.first = true; it.deps.forEach(mark); };
  items.forEach(it => { it.first = false; });
  items.filter(it => it.sk.id === CYBER).forEach(mark);
  const baseT = timeItems(items, cur, imp);
  let blocks;
  if (!items.length) blocks = [];
  else if (mode === 0) blocks = [{ a: cur, items, remap: false }];
  else if (mode === 1) blocks = [{ a: bestRemap(items, imp).a, items }];
  else blocks = bestTwo(items, imp).blocks;
  const done = new Set(); let clock = 0;
  const outBlocks = blocks.map(b => {
    const rows = orderBlock(b.items, b.a, imp, done).map(r => { const row = { ...r, start: clock, end: clock + r.t }; clock += r.t; return row; });
    return { a: b.a, remap: b.remap !== false, rows, t: rows.reduce((x, r) => x + r.t, 0) };
  });
  return { baseT, total: clock, blocks: outBlocks, sp: items.reduce((x, it) => x + it.sp, 0) };
}

  min = Math.round(min);
  const d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60), m = min % 60;
  return (d ? d + 'd ' : '') + (d || h ? h + 'h ' : '') + m + 'm';
}

// Returns [{rule, rows:[{sk, lvl, from, why}]}] with only what the plan is missing.
function suggestions(planObj) {
  const names = new Set(), groups = new Set();
  for (const id of planObj.planned.keys()) { const sk = BY_ID.get(id); names.add(sk.name); groups.add(sk.group); }
  const ctx = { names, groups, items: planObj.items.length };
  const seen = new Set(), out = [];
  for (const r of RULES) {
    if (!r.when(ctx)) continue;
    const list = typeof r.add === 'function' ? r.add(ctx) : r.add;
    const rows = [];
    for (const [n, lvl] of list) {
      const sk = skillByName(n); if (!sk) continue;
      const have = planObj.levelOf(sk.id);
      if (have >= lvl || seen.has(sk.id)) continue;
      seen.add(sk.id);
      rows.push({ sk, lvl, from: have + 1 });
    }
    if (rows.length) out.push({ rule: r, rows });
  }
  return out;
}


// ---- Fit: EFT parsing and the skills a ship needs. TYPES: [name, category, group, metaGroup, requirements] ----
const TYPE_BY_NAME = new Map();
if (typeof TYPES !== 'undefined') for (const [name, cat, group, meta, req] of TYPES) TYPE_BY_NAME.set(name.toLowerCase(), { name, cat, group, meta, req });

// EFT: [Ship, name], then modules "Module, Ammo", drones/cargo "Name x5".
function parseFit(text) {
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let ship = null, fitName = '';
  const types = [], unknown = [];
  for (const line of lines) {
    const h = line.match(/^\[([^,\]]+)(?:,\s*([^\]]*))?\]$/);
    if (h) {
      const t = TYPE_BY_NAME.get(h[1].trim().toLowerCase());
      if (/^empty /i.test(h[1])) continue;
      if (!ship && t && t.cat === 6) { ship = t; fitName = (h[2] || '').trim(); continue; }
      if (!t) { unknown.push(line); continue; }
    }
    for (let part of line.split(/,\s*/)) {
      part = part.replace(/\s*\/\s*offline$/i, '').replace(/\s+x\d+$/i, '').trim();
      if (!part || /^\[empty .*\]$/i.test(part)) continue;
      const t = TYPE_BY_NAME.get(part.toLowerCase());
      if (t) types.push(t); else unknown.push(part);
    }
  }
  return { ship, fitName, types, unknown };
}

const WEAPON_GROUP = /Weapon|Launcher|Vorton|Projector|Combat Drone|Fighter|Sentry/i;
const ELITE5 = new Set(['Gunnery', 'Drones', 'Missile Launcher Operation', 'Rapid Firing', 'Surgical Strike', 'Drone Interfacing', 'Warhead Upgrades', 'Rapid Launch',
  'Hull Upgrades', 'Shield Management', 'Shield Upgrades', 'Shield Operation', 'Repair Systems', 'Mechanics', 'Capacitor Management', 'Capacitor Systems Operation',
  'CPU Management', 'Power Grid Management', 'Weapon Upgrades', 'Navigation', 'Evasive Maneuvering', 'Leadership', 'Thermodynamics']);

// tier: 0 minimum, 1 good, 2 elite. Returns Map skillId -> {lvl, why:'ship'|'weapon'|'module'|'support'|'req'}
function fitSkills(fit, tier) {
  const need = new Map();
  const want = (id, lvl, why) => {
    const cur = need.get(id);
    if (!cur || cur.lvl < lvl) need.set(id, { lvl, why: cur && cur.why !== 'req' ? cur.why : why });
    for (const [r, rl] of BY_ID.get(id).req) want(r, rl, 'req');
  };
  const direct = (t, why) => {
    for (const [id, l] of t.req) {
      const spec = /Specialization$/.test(BY_ID.get(id).name);
      let lvl = l;
      if (tier === 1) lvl = Math.max(l, spec ? 3 : 4);
      if (tier === 2) lvl = Math.max(l, spec ? 4 : 5);
      want(id, lvl, why);
    }
  };
  if (fit.ship) { if (tier) direct(fit.ship, 'ship'); else for (const [id, l] of fit.ship.req) want(id, l, 'ship'); }
  for (const t of fit.types) {
    const weapon = WEAPON_GROUP.test(t.group) && (t.cat === 7 || t.cat === 18 || t.cat === 87);
    if (tier && weapon) direct(t, 'weapon');
    else for (const [id, l] of t.req) want(id, l, weapon ? 'weapon' : 'module');
  }
  if (tier) {
    // Support skills from the same rules as the plan, matched to the skills the fit needs.
    const names = new Set([...need.keys()].map(id => BY_ID.get(id).name));
    const groups = new Set([...need.keys()].map(id => BY_ID.get(id).group));
    const ctx = { names, groups, items: 1 };
    for (const r of RULES) {
      if (!r.when(ctx)) continue;
      for (const [n, l] of (typeof r.add === 'function' ? r.add(ctx) : r.add)) {
        const sk = skillByName(n); if (!sk) continue;
        want(sk.id, tier === 2 && ELITE5.has(n) ? 5 : l, 'support');
      }
    }
  }
  return need;
}

      tabPlan: 'Plan i remap', tabFit: 'Fit → skille', fitLbl: 'Fit (format EFT)',
      fitHelp: 'W grze: okno Fitting, Copy to clipboard. W Pyfa: Ctrl+C.', tierLbl: 'Poziom skilli', tier0: 'Minimum', tier1: 'Dobrze', tier2: 'Elita',
      tierHint0: 'Wszystko, żeby wsiąść do statku i włączyć każdy moduł.', tierHint1: 'Statek i broń na 4 plus skille wspierające do tego, co masz w ficie.', tierHint2: 'Najważniejsze skille na 5, specjalizacje T2 na 4. Długo.',
      grp: { ship: 'Statek', weapon: 'Broń i drony', module: 'Moduły', support: 'Skille wspierające', req: 'Wymagania' },
      copyGame: 'Kopiuj do planu w grze', toPlanner: 'Policz remap', kShip: 'Statek', kSkills: 'Do wytrenowania', kTime: 'Czas treningu',
      timeNote: 'liczone od skilli startowych', skillsN: (n, sp) => `${n} skilli, ${sp} mln SP`, noFit: 'Wklej fit, żeby zobaczyć potrzebne skille.',
      fitTitle: t => 'Skille do fitu: ' + t, haveIt: 'skill startowy', fitUnknown: n => `Nie rozpoznano (${n}):`, fitOk: n => `Rozpoznano ${n} modułów, dronów i amunicji.`,
      gameHint: 'W grze utwórz nowy plan skilli i wklej listę. Gra sama pominie to, co już masz, i pokaże prawdziwy czas dla twojej postaci. Żeby policzyć remap, skopiuj pozostałą kolejkę z powrotem do zakładki Plan i remap.',
      sentToPlan: 'Plan zastąpiony skillami z fitu',
      addedT: s => 'Dodano ' + s, raceLbl: 'Skille startowe nowej postaci', auto: 'Auto', off: 'Wyłącz',
      raceInfo: (r, n, a) => `${a ? 'Rozpoznano z planu: ' : ''}${r}, ${n} skilli startowych liczę jako wytrenowane (tylko dla skilli spoza planu).`, raceOff: 'Skille startowe są pomijane.', raceCommon: n => `W planie nie ma rasy, więc jako wytrenowane liczę tylko ${n} skilli, z którymi startuje każda rasa.`, addedReq: 'Dodano wymagania', switchTo: 'English', switchAria: 'Switch to English', locale: 'pl-PL',
    },
  };
  const store = {
    get(k, d) { try { const v = localStorage.getItem('remap.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('remap.' + k, JSON.stringify(v)); } catch (e) {} },
  };
  const state = {
    lang: store.get('lang', 'en'), tab: store.get('tab', 'plan'), tier: store.get('tier', 1), race: store.get('race', 'auto'), mode: store.get('mode', 1), imp: store.get('imp', 5),
    cur: store.get('cur', { P: 20, M: 20, W: 20, I: 20, C: 19 }),
  };
  let L = T[state.lang];
  const num = (x, d) => x.toLocaleString(L.locale, { minimumFractionDigits: d, maximumFractionDigits: d });

  $('plan').value = store.get('plan', SAMPLE);
  $('trained').value = store.get('trained', '');
  $('fit').value = store.get('fit', '');
  if ($('trained').value.trim()) $('trainedBox').open = true;

  function applyLang() {
    L = T[state.lang];
    document.documentElement.lang = state.lang;
    document.title = L.docTitle;
    document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = L[el.dataset.i]; });
    // The button shows the flag of the other language
    const other = state.lang === 'en' ? 'pl' : 'en';
    $('lang').innerHTML = FLAG[other] + '<span>' + L.switchTo + '</span>';
    $('lang').setAttribute('aria-label', L.switchAria);
  }
  $('lang').addEventListener('click', () => { store.set('plan', $('plan').value); store.set('trained', $('trained').value); store.set('fit', $('fit').value); state.lang = state.lang === 'en' ? 'pl' : 'en'; store.set('lang', state.lang); applyLang(); run(); });

  $('attrs').innerHTML = ATTRS.map(k => `<label for="at${k}">${ANAME[k]}<input id="at${k}" type="number" min="17" max="27" inputmode="numeric" value="${state.cur[k]}"></label>`).join('');
  ATTRS.forEach(k => $('at' + k).addEventListener('input', () => { state.cur[k] = Math.max(0, +$('at' + k).value || 0); store.set('cur', state.cur); run(); }));

  function seg(id, key) {
    const el = $(id);
    const paint = () => el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === state[key])));
    el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state[key] = +b.dataset.v; store.set(key, state[key]); paint(); run(); });
    paint();
  }
  seg('segRemaps', 'mode'); seg('segImp', 'imp'); seg('segTier', 'tier');
  function showTab() {
    const fit = state.tab === 'fit';
    $('inPlan').hidden = fit; $('viewPlan').hidden = fit; $('inFit').hidden = !fit; $('viewFit').hidden = !fit;
    $('tabPlan').setAttribute('aria-selected', String(!fit)); $('tabFit').setAttribute('aria-selected', String(fit));
  }
  document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; state.tab = b.dataset.tab; store.set('tab', state.tab); showTab(); run(); });
  showTab();
  (function () {
    const el = $('segRace');
    const paint = () => el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === String(state.race))));
    el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.race = b.dataset.v; store.set('race', state.race); paint(); run(); });
    paint();
  })();
  const RACE = { 1: 'Caldari', 2: 'Minmatar', 4: 'Amarr', 8: 'Gallente' };
  const COMMON = new Map(Object.entries(STARTER['1']).filter(([id, l]) => Object.values(STARTER).every(r => r[id] === l)).map(([id, l]) => [+id, l]));
  function starterFor(entries) {
    if (state.race === 'off') return { map: new Map(), info: L.raceOff };
    let race = state.race, auto = false;
    if (race === 'auto') {
      auto = true; race = null; let best = 0;
      for (const [rid, rn] of Object.entries(RACE)) {
        const n = entries.filter(e => BY_ID.get(e.id).name.startsWith(rn + ' ')).length;
        if (n > best) { best = n; race = rid; }
      }
      if (!race) return { map: COMMON, info: L.raceCommon(COMMON.size) };
    }
    const map = new Map(Object.entries(STARTER[race]).map(([id, l]) => [+id, l]));
    return { map, info: L.raceInfo(RACE[race], map.size, auto) };
  }

  let tmr;
  ['plan', 'trained', 'fit'].forEach(id => $(id).addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(() => { store.set(id, $(id).value); run(); }, 250); }));

  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
    document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
  }
  function copy(text) {
    const done = () => toast(L.copied(text.split('\n').length));
    const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast(L.copyFail); } ta.remove(); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const lvbar = (have, to) => '<span class="lvbar" aria-hidden="true">' + [1, 2, 3, 4, 5].map(l => `<i class="${l <= have ? 'on' : l <= to ? 'new' : ''}"></i>`).join('') + '</span>';

  function appendLines(sk, from, to) {
    const lines = []; for (let x = from; x <= to; x++) lines.push(sk.name + ' ' + x);
    const ta = $('plan'); ta.value = ta.value.replace(/\s*$/, '') + '\n' + lines.join('\n') + '\n';
  }

  let last = null;
  function run() {
    const parsed = parseList($('plan').value);
    const tr = parseList($('trained').value);
    const trained = new Map(); tr.entries.forEach(e => trained.set(e.id, Math.max(trained.get(e.id) || 0, e.lvl)));
    const st = starterFor(parsed.entries);
    $('raceInfo').textContent = st.info;
    const P = buildPlan(parsed.entries, trained, st.map);
    const imp = state.imp, cur = state.cur;
    const R = plan(P.items, state.mode, cur, imp);
    last = R;

    const dup = parsed.entries.length - new Set(parsed.entries.map(e => e.id + ':' + e.lvl)).size;
    let info = L.planInfo(P.items.length, num(R.sp / 1e6, 2));
    if (dup) info += L.dup(dup);
    if (parsed.unknown.length) info += ` <span style="color:var(--bad)">${L.unknown(parsed.unknown.length)} ${esc(parsed.unknown.slice(0, 4).join(', '))}${parsed.unknown.length > 4 ? '…' : ''}</span>`;
    $('planInfo').innerHTML = info;
    const sum = ATTRS.reduce((x, k) => x + cur[k], 0);
    $('attrSum').textContent = sum === 99 ? L.sumOk : L.sumBad(sum);
    $('attrSum').className = 'sum' + (sum === 99 ? '' : ' bad');

    const gain = R.baseT - R.total;
    const end = new Date(Date.now() + R.total * 60000);
    $('summary').innerHTML = `
      <div><div class="k">${L.kPlan}</div><div class="v">${fmtDur(R.total)}</div><div class="n">${L.endAt(end.toLocaleDateString(L.locale, { day: 'numeric', month: 'long', year: 'numeric' }))}</div></div>
      <div><div class="k">${L.kBase}</div><div class="v mid">${fmtDur(R.baseT)}</div><div class="n">${L.baseNote(imp)}</div></div>
      <div><div class="k">${L.kGain}</div><div class="v mid gain">${gain > 30 ? fmtDur(gain) : '—'}</div><div class="n">${gain > 30 ? L.faster(num(gain / R.baseT * 100, 1)) : L.noGain}</div></div>`;

    $('remapTitle').textContent = state.mode === 0 ? L.tAttrs : state.mode === 1 ? L.tRemap : L.tRemaps;
    const nRemap = R.blocks.filter(b => b.remap).length;
    $('remaps').innerHTML = R.blocks.map((b, i) => {
      const title = !b.remap ? L.curAttrs : nRemap > 1 ? L.remapN(i + 1) : L.tRemap;
      const when = !b.remap ? L.unchanged : i === 0 ? L.now : L.after(b.rows[0] ? fmtDur(b.rows[0].start) : '');
      const rows = ATTRS.map(k => {
        const d = b.a[k] - 17;
        return `<div class="arow${b.remap && d > 0 ? ' up' : ''}"><span>${ANAME[k]}</span><span class="track"><span class="fill" style="width:${Math.min(100, (b.a[k] - 15) / 12 * 100)}%"></span></span><span class="val">${b.a[k]}</span><span class="d">${b.remap ? (d ? '+' + d : '') : ''}</span></div>`;
      }).join('');
      return `<article class="remap${i === 0 && b.remap ? ' first' : ''}">
        <div class="head"><span class="title">${title}</span><span class="when">${when}</span></div>${rows}
        <div class="foot"><span><b>${b.rows.length}</b> ${L.levels} · <b>${fmtDur(b.t)}</b></span>${R.blocks.length > 1 ? `<button type="button" class="btn small" data-copy="${i}">${L.copyBlock(i + 1)}</button>` : ''}</div></article>`;
    }).join('') || `<p class="empty">${L.pastePlan}</p>`;
    if (state.mode === 2 && R.blocks.length === 1) $('remaps').insertAdjacentHTML('beforeend', `<p class="note info">${L.noSecond}</p>`);

    const refA = R.blocks[0] ? R.blocks[0].a : cur;
    const tFor = (sk, from, to) => { let t = 0; for (let x = from; x <= to; x++) t += spFor(sk, x) / rateOf(sk, refA, imp); return t; };
    const missIds = new Set(P.missing.map(m => m.sk.id));
    let html = '';
    if (P.missing.length) {
      const must = P.missing.filter(m => m.inPlan), check = P.missing.filter(m => !m.inPlan);
      html += `<div class="sg-group" id="reqGroup"><div class="sg-head"><span class="t">${L.reqH}</span><button type="button" class="btn small" id="addAllReq">${L.addAll}</button></div>
        <div class="hint" style="margin-bottom:6px">${L.reqHint}</div>`;
      for (const m of [...must, ...check]) html += `<div class="sg-row"><button type="button" class="plus" data-add="${m.sk.id}:${m.have + 1}:${m.lvl}" aria-label="+ ${esc(m.sk.name)}">+</button>
        <div class="nm">${esc(m.sk.name)} <span style="font-family:var(--f-mono);color:var(--accent)">${ROM[m.lvl]}</span>${lvbar(m.have, m.lvl)}
        <span class="chip ${m.inPlan ? 'must' : 'check'}">${m.inPlan ? L.tooLow : L.check}</span>
        <small>${L.neededBy}: ${esc([...m.by].slice(0, 3).join(', '))}${m.by.size > 3 ? L.andMore(m.by.size - 3) : ''}</small></div>
        <span class="tm">+${fmtDur(tFor(m.sk, m.have + 1, m.lvl))}</span></div>`;
      html += '</div>';
    }
    for (const g of suggestions(P)) {
      const rows = g.rows.filter(r => !missIds.has(r.sk.id));
      if (!rows.length) continue;
      html += `<div class="sg-group"><div class="sg-head"><span class="t">${esc(g.rule.label[state.lang])}</span><span class="w">${esc(g.rule.why[state.lang])}</span></div>`;
      for (const r of rows) html += `<div class="sg-row"><button type="button" class="plus" data-add="${r.sk.id}:${r.from}:${r.lvl}" aria-label="+ ${esc(r.sk.name)}">+</button>
        <div class="nm">${esc(r.sk.name)} <span style="font-family:var(--f-mono);color:var(--accent)">${ROM[r.lvl]}</span>${lvbar(r.from - 1, r.lvl)}<small>${r.from > 1 ? L.have(ROM[r.from - 1]) : ''}${SHORT[r.sk.p]}/${SHORT[r.sk.s]}, ${L.rank} ${r.sk.rank}</small></div>
        <span class="tm">+${fmtDur(tFor(r.sk, r.from, r.lvl))}</span></div>`;
      html += '</div>';
    }
    $('sg').innerHTML = html || `<p class="empty">${L.nothing}</p>`;
    if (!$('trained').value.trim() && html) $('sg').insertAdjacentHTML('beforeend', `<p class="hint">${L.fromOne}</p>`);

    let q = `<thead><tr><th>#</th><th>${L.thSkill}</th><th>${L.thAttr}</th><th class="num">${L.thTime}</th><th class="num">${L.thEnd}</th></tr></thead><tbody>`;
    let n = 0;
    R.blocks.forEach((b, i) => {
      if (b.remap && (R.blocks.length > 1 || state.mode > 0)) q += `<tr class="divider"><td colspan="5">${i === 0 ? L.nowR : L.hereR}: ${R.blocks.length > 1 ? L.remapLow + ' ' + (i + 1) : L.remapLow}<small>${ATTRS.map(k => SHORT[k] + ' ' + b.a[k]).join(' · ')}</small></td></tr>`;
      for (const r of b.rows) q += `<tr><td class="i">${++n}</td><td>${esc(r.it.sk.name)}<span class="lv">${ROM[r.it.lvl]}</span>${r.it.auto ? `<span class="auto">${L.added}</span>` : ''}</td><td><span class="pair">${SHORT[r.it.sk.p]}/${SHORT[r.it.sk.s]}</span></td><td class="num">${fmtDur(r.t)}</td><td class="num">${fmtDur(r.end)}</td></tr>`;
    });
    $('queue').innerHTML = q + '</tbody>';
    $('qBtns').innerHTML = (R.blocks.length > 1 ? R.blocks.map((b, i) => `<button type="button" class="btn" data-copy="${i}">${L.copyBlock(i + 1)}</button>`).join('') : '')
      + `<button type="button" class="btn primary" id="copyAll">${L.copyAll}</button>`;
    runFit(trained);
  }

  let lastFit = null;
  function runFit(trainedUser) {
    $('tierHint').textContent = L['tierHint' + state.tier];
    const f = parseFit($('fit').value);
    if (!f.ship && !f.types.length) {
      lastFit = null;
      $('fitInfo').textContent = L.fitHelp;
      $('fitSummary').innerHTML = `<div style="grid-column:1/-1"><div class="n">${L.noFit}</div></div>`;
      $('fitTitle').textContent = ''; $('fitList').innerHTML = ''; $('fBtns').innerHTML = '';
      return;
    }
    let info = L.fitOk(f.types.length);
    if (f.unknown.length) info += ` <span style="color:var(--bad)">${L.fitUnknown(f.unknown.length)} ${esc(f.unknown.slice(0, 3).join(', '))}${f.unknown.length > 3 ? '…' : ''}</span>`;
    $('fitInfo').innerHTML = info + '<br>' + L.fitHelp;
    const need = fitSkills(f, state.tier);
    const st = starterFor([...need.keys()].map(id => ({ id, lvl: 1 })));
    if (state.tab === 'fit') $('raceInfo').textContent = st.info;
    const have = id => Math.max(trainedUser.get(id) || 0, st.map.get(id) || 0);
    const ents = [];
    for (const [id, v] of need) for (let x = have(id) + 1; x <= v.lvl; x++) ents.push({ id, lvl: x });
    const P = buildPlan(ents, trainedUser, st.map);
    const R = plan(P.items, state.mode, state.cur, state.imp);
    const rows = R.blocks.flatMap(b => b.rows);
    lastFit = R;
    const tBySkill = new Map(); rows.forEach(r => tBySkill.set(r.it.sk.id, (tBySkill.get(r.it.sk.id) || 0) + r.t));
    $('fitSummary').innerHTML = `
      <div><div class="k">${L.kShip}</div><div class="v mid">${esc(f.ship ? f.ship.name : '?')}</div><div class="n">${esc(f.fitName || '')}</div></div>
      <div><div class="k">${L.kSkills}</div><div class="v mid">${tBySkill.size}</div><div class="n">${L.skillsN(need.size, num(R.sp / 1e6, 2))}</div></div>
      <div><div class="k">${L.kTime}</div><div class="v mid">${fmtDur(R.total)}</div><div class="n">${L.timeNote}</div></div>`;
    $('fitTitle').textContent = L.fitTitle(L['tier' + state.tier]);
    $('fBtns').innerHTML = `<button type="button" class="btn" id="toPlanner">${L.toPlanner}</button>`
      + (R.blocks.length > 1 ? R.blocks.map((b, i) => `<button type="button" class="btn" data-fcopy="${i}">${L.copyBlock(i + 1)}</button>`).join('') : '')
      + `<button type="button" class="btn primary" id="copyGame">${L.copyGame}</button>`;
    let html = '';
    for (const g of ['ship', 'weapon', 'module', 'support', 'req']) {
      const list = [...need].filter(([, v]) => v.why === g).sort((a, b) => (tBySkill.get(b[0]) || 0) - (tBySkill.get(a[0]) || 0));
      if (!list.length) continue;
      html += `<div class="fitgrp"><h3>${L.grp[g]}</h3>`;
      for (const [id, v] of list) {
        const sk = BY_ID.get(id), h = have(id), t = tBySkill.get(id) || 0;
        html += `<div class="fitrow${h >= v.lvl ? ' done' : ''}"><div>${esc(sk.name)} <span style="font-family:var(--f-mono);color:var(--accent)">${ROM[v.lvl]}</span>${lvbar(h, v.lvl)}<small>${SHORT[sk.p]}/${SHORT[sk.s]}, ${L.rank} ${sk.rank}${h >= v.lvl ? ' · ' + L.haveIt : ''}</small></div><span class="tm">${t ? '+' + fmtDur(t) : '✓'}</span></div>`;
      }
      html += '</div>';
    }
    $('fitList').innerHTML = html;
  }

  const listText = rows => rows.map(r => r.it.sk.name + ' ' + r.it.lvl).join('\n');
  document.addEventListener('click', e => {
    const add = e.target.closest('[data-add]');
    if (add) { const [id, from, to] = add.dataset.add.split(':').map(Number); appendLines(BY_ID.get(id), from, to); store.set('plan', $('plan').value); run(); toast(L.addedT(BY_ID.get(id).name + ' ' + ROM[to])); return; }
    const cb = e.target.closest('[data-copy]');
    if (cb && last) { copy(listText(last.blocks[+cb.dataset.copy].rows)); return; }
    if (e.target.closest('#copyAll') && last) copy(listText(last.blocks.flatMap(b => b.rows)));
    const fc = e.target.closest('[data-fcopy]');
    if (fc && lastFit) { copy(listText(lastFit.blocks[+fc.dataset.fcopy].rows)); return; }
    if (e.target.closest('#copyGame') && lastFit) copy(listText(lastFit.blocks.flatMap(b => b.rows)));
    if (e.target.closest('#toPlanner') && lastFit) {
      $('plan').value = listText(lastFit.blocks.flatMap(b => b.rows)) + '\n'; store.set('plan', $('plan').value);
      state.tab = 'plan'; store.set('tab', 'plan'); showTab(); run(); toast(L.sentToPlan);
    }
    if (e.target.closest('#addAllReq')) {
      document.querySelectorAll('#reqGroup [data-add]').forEach(b => { const [id, from, to] = b.dataset.add.split(':').map(Number); appendLines(BY_ID.get(id), from, to); });
      store.set('plan', $('plan').value); run(); toast(L.addedReq);
    }
  });
  applyLang();
  run();
})();
</script>
<script>
// Only in the .exe app: tells it the window is still open.
if (location.host === '127.0.0.1:47321') {
  const ping = () => fetch('/ping', { cache: 'no-store' }).catch(() => {});
  ping(); setInterval(ping, 5000);
  addEventListener('pagehide', () => { try { navigator.sendBeacon('/bye'); } catch (e) {} });
}
</script>

</body></html>
