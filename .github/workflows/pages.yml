name: Pages

# Publishes the planner as a live demo on GitHub Pages.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: [remap-planner.html, docs/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir site
          cp remap-planner.html site/index.html
          cp -r docs site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
