name: Release

# Publishes a GitHub release (and its tag) for the newest version in CHANGELOG.md.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: exe-src/go.mod
      - name: Build EveRemapPlanner.exe
        working-directory: exe-src
        run: |
          cp ../remap-planner.html .
          go install github.com/tc-hib/go-winres@v0.3.3
          "$(go env GOPATH)/bin/go-winres" make --arch amd64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui -s -w" -o ../EveRemapPlanner.exe .
      - name: Create release for the newest changelog version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(grep -m1 -oP '^## \[\K[0-9][^\]]*' CHANGELOG.md || true)
          if [ -z "$ver" ]; then echo "No version in CHANGELOG.md"; exit 0; fi
          tag="v$ver"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already released"; exit 0; fi
          awk -v v="$ver" '/^## /{ if (f) exit; if (index($0, "[" v "]")) { f=1; next } } f' CHANGELOG.md > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md EveRemapPlanner.exe remap-planner.html
